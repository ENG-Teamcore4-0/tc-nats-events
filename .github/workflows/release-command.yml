name: Release Command

on:
  issue_comment:
    types: [created]

jobs:
  release:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    
    steps:
    - name: Check if user has permission
      run: |
        # Check user permission using GitHub CLI
        PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
        
        if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" ]]; then
          gh issue comment ${{ github.event.issue.number }} --body "❌ You do not have permission to create releases."
          exit 1
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Parse release command
      id: parse
      run: |
        COMMENT="${{ github.event.comment.body }}"
        
        # Extract version type (patch, minor, major) or specific version
        if echo "$COMMENT" | grep -q "/release patch"; then
          echo "type=patch" >> $GITHUB_OUTPUT
        elif echo "$COMMENT" | grep -q "/release minor"; then
          echo "type=minor" >> $GITHUB_OUTPUT
        elif echo "$COMMENT" | grep -q "/release major"; then
          echo "type=major" >> $GITHUB_OUTPUT
        elif echo "$COMMENT" | grep -qE "/release [0-9]+\.[0-9]+\.[0-9]+"; then
          VERSION=$(echo "$COMMENT" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "type=custom" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        else
          echo "type=patch" >> $GITHUB_OUTPUT
        fi
        
        # Check for prerelease flag
        if echo "$COMMENT" | grep -q -- "--prerelease"; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Get PR details
      id: pr
      run: |
        # Get PR details using GitHub CLI
        PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
        
        PR_REF=$(echo "$PR_DATA" | jq -r '.head.ref')
        PR_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
        PR_MERGED=$(echo "$PR_DATA" | jq -r '.merged')
        PR_MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
        
        echo "ref=$PR_REF" >> $GITHUB_OUTPUT
        echo "sha=$PR_SHA" >> $GITHUB_OUTPUT
        echo "merged=$PR_MERGED" >> $GITHUB_OUTPUT
        echo "mergeable=$PR_MERGEABLE" >> $GITHUB_OUTPUT
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bump2version

    - name: Calculate new version
      id: version
      run: |
        # Get current version
        if [ -f "pyproject.toml" ]; then
          CURRENT_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        else
          CURRENT_VERSION=$(grep -E "version\s*=" setup.py | sed -E 's/.*version\s*=\s*["\x27]([^"\x27]+)["\x27].*/\1/')
        fi
        
        echo "Current version: $CURRENT_VERSION"
        
        if [ "${{ steps.parse.outputs.type }}" == "custom" ]; then
          NEW_VERSION="${{ steps.parse.outputs.version }}"
        else
          # Use bump2version to calculate new version
          bump2version --dry-run --list ${{ steps.parse.outputs.type }} > version_info.txt
          NEW_VERSION=$(grep "new_version=" version_info.txt | cut -d= -f2)
        fi
        
        echo "New version: $NEW_VERSION"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: React to comment
      run: |
        # Add rocket reaction to comment using GitHub CLI
        gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
          --method POST \
          --field content=rocket
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment release plan
      run: |
        # Create release plan comment
        NEW_VERSION="${{ steps.version.outputs.version }}"
        PRERELEASE_FLAG="${{ steps.parse.outputs.prerelease }}"
        
        if [ "$PRERELEASE_FLAG" == "true" ]; then
          PRERELEASE_TEXT="✅ Yes"
        else
          PRERELEASE_TEXT="❌ No"
        fi
        
        COMMENT_BODY="🚀 **Release Plan**

        - **New Version**: \`${NEW_VERSION}\`
        - **Release Type**: \`${{ steps.parse.outputs.type }}\`
        - **Prerelease**: ${PRERELEASE_TEXT}
        
        The release will be created once this PR is merged.
        
        ---
        
        *This is an automated response to the \`/release\` command.*"
        
        gh issue comment ${{ github.event.issue.number }} --body "$COMMENT_BODY"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create release (if PR is merged)
      if: steps.pr.outputs.merged == 'true'
      run: |
        echo "🚀 PR is merged. Creating release now..."
        
        # Update version in pyproject.toml
        sed -i 's/version = ".*"/version = "${{ steps.version.outputs.version }}"/' pyproject.toml
        
        # Commit and tag
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml
        git commit -m "Release ${{ steps.version.outputs.version }}"
        
        TAG="v${{ steps.version.outputs.version }}"
        git tag -a $TAG -m "Release $TAG"
        git push origin main --tags
        
        echo "✅ Version updated and tagged. Auto-release workflow will handle the rest."
        
        # Comment on the PR
        gh issue comment ${{ github.event.issue.number }} --body "✅ Release $TAG created! The CI will run and then the release will be published automatically."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Wait for auto-release (if PR not merged yet)
      if: steps.pr.outputs.merged != 'true'
      run: |
        echo "⏳ PR not merged yet. Release will be created when PR is merged and version is committed."
        gh issue comment ${{ github.event.issue.number }} --body "⏳ Release will be created automatically when this PR is merged."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}