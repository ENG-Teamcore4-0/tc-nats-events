name: Manual Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # For trusted publishing to PyPI
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Extract or set version
      id: tag
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          TAG="v$VERSION"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Create tag for manual release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $TAG -m "Release $TAG"
          git push origin $TAG
        else
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
    
    - name: Generate changelog
      id: changelog
      run: |
        VERSION="${{ steps.tag.outputs.version }}"
        
        # Generate changelog from git log
        echo "# Release ${{ steps.tag.outputs.tag }}" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Changes" >> CHANGELOG.md
        
        # Get previous tag for comparison
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD --no-merges >> CHANGELOG.md
        else
          echo "- Initial release" >> CHANGELOG.md
        fi
        
        echo "" >> CHANGELOG.md
        echo "## Installation" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "\`\`\`bash" >> CHANGELOG.md
        echo "pip install tc-nats-events==$VERSION" >> CHANGELOG.md
        echo "\`\`\`" >> CHANGELOG.md
    
    - name: Create GitHub Release
      run: |
        # Determine if prerelease
        PRERELEASE=""
        if [ "${{ github.event.inputs.prerelease }}" == "true" ] || \
           [[ "${{ steps.tag.outputs.tag }}" == *"alpha"* ]] || \
           [[ "${{ steps.tag.outputs.tag }}" == *"beta"* ]] || \
           [[ "${{ steps.tag.outputs.tag }}" == *"rc"* ]]; then
          PRERELEASE="--prerelease"
        fi
        
        # Create release using GitHub CLI
        gh release create ${{ steps.tag.outputs.tag }} \
          --title "Release ${{ steps.tag.outputs.tag }}" \
          --notes-file CHANGELOG.md \
          --target main \
          $PRERELEASE \
          --generate-notes \
          dist/*.tar.gz dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Note: PyPI publishing disabled for internal package
    # - name: Publish to PyPI
    #   uses: pypa/gh-action-pypi-publish@release/v1
    #   with:
    #     repository-url: https://upload.pypi.org/legacy/
    #     skip-existing: true